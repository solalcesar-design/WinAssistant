<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="robots" content="noindex, nofollow">
    
    <title>WinAssistant - S & C Software</title>

    <style>
        :root {
            --primary-glow: #00d2ff;
            --secondary-glow: #9d50bb;
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            width: 45px;
            height: 45px;
            border-radius: 10px;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at center, #1c212e 0%, #0b0e14 100%);
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            margin: 0;
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8b949e;
            max-width: 600px;
            margin: 20px 0 40px;
        }

        .download-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-download {
            background: linear-gradient(45deg, #007cf0, #00dfd8);
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.4);
        }

        .warning-text {
            color: #8b949e;
            font-size: 0.8rem;
            max-width: 350px;
            line-height: 1.4;
        }

        .contact-section {
            padding: 50px 10%;
            background: #0d1117;
            text-align: center;
            border-top: 1px solid #30363d;
        }

        .contact-link {
            color: var(--primary-glow);
            text-decoration: none;
            font-weight: 500;
        }

        footer {
            padding: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="logo.ico" alt="WinAssistant Logo">
            <span style="font-size: 1.4rem; font-weight: 700;">WinAssistant</span>
        </div>
    </header>

    <main class="hero">
        <h1>WinAssistant</h1>
        <p class="subtitle">Accédez à votre assistant virtuel IA pour PC.</p>
        
        <div class="download-box">
            <a href="https://drive.google.com/file/d/18PWPlF03fvvkGL1cqaKfs1JoQJBlvCG9/view?usp=sharing" class="btn-download">
                Télécharger (1.6 Go)
            </a>
            <div class="warning-text">
                Installation sécurisée pour Windows. <br>
                Note : Acceptez le téléchargement sur la page Google Drive.
            </div>
        </div>
    </main>

    <section class="contact-section">
        <p>Support S & C Software : <a href="mailto:solalcesar@gmail.com" class="contact-link">solalcesar@gmail.com</a></p>
    </section>

    <footer>
        <p>&copy; 2026 S & C Software - Page Privée</p>
    </footer>

</body>
</html>
